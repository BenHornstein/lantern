<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern — keep the light on</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1430; --ink:#f3ecff; --dim:#a99cc9;
    --amber:#ffb648; --moth:#cbbdff; --seed:#5fe3c0; --rose:#ff6b8b;
  }
  [hidden]{display:none!important}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}

  #xp{position:fixed;top:0;left:0;right:0;height:6px;background:rgba(255,255,255,.08)}
  #xp i{display:block;height:100%;width:0;background:var(--seed)}
  .row{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;
    display:flex;justify-content:space-between;align-items:baseline;pointer-events:none;
    font-weight:800;font-size:18px;letter-spacing:.01em}
  #tm{font-size:26px}
  .row small{font-weight:500;color:var(--dim);font-size:14px;margin-left:6px}

  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;background:rgba(18,12,38,.72);backdrop-filter:blur(3px)}
  h1{font-size:clamp(56px,14vw,120px);line-height:.9;margin:0 0 12px;font-weight:800;letter-spacing:-.04em;color:var(--amber)}
  h2{font-size:clamp(32px,7vw,56px);line-height:1;margin:0 0 18px;font-weight:800;letter-spacing:-.03em}
  p{margin:0 0 10px;max-width:38ch;line-height:1.45;color:var(--dim);font-size:17px}
  p b{color:var(--ink);font-weight:500}
  button{font:inherit;cursor:pointer}
  .go{margin-top:18px;background:var(--amber);color:#2a1a05;border:0;border-radius:999px;
    padding:14px 30px;font-weight:800;font-size:19px}
  .go:hover{filter:brightness(1.08)}
  .go:focus-visible,.card:focus-visible{outline:3px solid var(--moth);outline-offset:3px}
  #cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:820px}
  .card{width:230px;text-align:left;background:#251c45;color:var(--ink);border:2px solid #3a2f66;
    border-radius:14px;padding:16px 18px}
  .card:hover{border-color:var(--amber)}
  .card strong{display:block;font-size:20px;font-weight:800;margin-bottom:4px}
  .card span{color:var(--dim);font-size:15px;line-height:1.35}
  .hint{margin-top:16px;font-size:14px}
  .stats{display:flex;gap:28px;margin:6px 0 4px;justify-content:center}
  .stats div{font-size:14px;color:var(--dim)}
  .stats b{display:block;font-size:32px;color:var(--ink);font-weight:800;letter-spacing:-.02em}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="xp"><i></i></div>
  <div class="row"><span id="lv"></span><span id="tm">0:00</span><span id="kl"></span></div>
</div>

<section id="menu" class="ov">
  <h1>Lantern</h1>
  <p><b>Keep the light on.</b> The moths are coming, and they want it.</p>
  <p>Move with <b>WASD</b> or arrow keys, or drag on a touchscreen. Your lantern fires on its own.</p>
  <button class="go" id="startBtn">Light the lantern</button>
</section>

<section id="lvl" class="ov" hidden>
  <h2>The flame grows</h2>
  <div id="cards"></div>
  <p class="hint">Click one, or press 1, 2 or 3.</p>
</section>

<section id="over" class="ov" hidden>
  <h2>The light went out.</h2>
  <div class="stats">
    <div><b id="oT">0:00</b>survived</div>
    <div><b id="oK">0</b>moths</div>
    <div><b id="oL">1</b>level</div>
  </div>
  <p id="oB"></p>
  <button class="go" id="againBtn">Light it again</button>
</section>

<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W, H, dpr;
function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize", resize); resize();

/* ---------- content ---------- */
const TYPES = {
  moth:  { hp: 2,  r: 8,  sp: 60,  dmg: 8,  col: "#cbbdff" },
  swift: { hp: 1,  r: 6,  sp: 115, dmg: 6,  col: "#ffd0e0" },
  big:   { hp: 12, r: 15, sp: 42,  dmg: 15, col: "#e2b7ff" },
};
const UPGRADES = [
  { n:"Brighter flame", d:"+30% damage",                    f:s=>s.dmg*=1.3 },
  { n:"Quick wick",     d:"+25% fire rate",                 f:s=>s.rate*=1.25 },
  { n:"Twin sparks",    d:"+1 projectile per shot",         f:s=>s.multi++ },
  { n:"Piercing glow",  d:"Shots pass through +1 moth",     f:s=>s.pierce++ },
  { n:"Firefly",        d:"An orbiting firefly burns moths",f:s=>s.orbit++ },
  { n:"Seed magnet",    d:"+50% pickup range",              f:s=>s.magnet*=1.5 },
  { n:"Light on your feet", d:"+12% move speed",            f:(s,p)=>p.speed*=1.12 },
  { n:"Warm heart",     d:"+20 max health, heal 50%",       f:(s,p)=>{p.max+=20;p.hp=Math.min(p.max,p.hp+p.max*.5)} },
  { n:"Wider glow",     d:"+20% light radius",              f:s=>s.light*=1.2 },
];

/* ---------- state ---------- */
let G, mode = "menu";
const keys = {};
let stick = null;
let best = 0;
try { best = +localStorage.getItem("lantern-best") || 0; } catch(e){}

function init(){
  G = { t:0, kills:0, level:1, xp:0, need:5, shake:0, cd:0, spawn:0, orbAng:0,
    p:{ x:0, y:0, hp:100, max:100, speed:170, inv:0, r:10 },
    s:{ dmg:1, rate:1.6, multi:1, pierce:0, magnet:70, orbit:0, light:200 },
    en:[], bl:[], sd:[], pt:[] };
}
init();

function show(id){ for (const s of ["menu","lvl","over"]) $(s).hidden = s !== id; }
function start(){ init(); mode = "play"; show(null); $("hud").hidden = false; }
function fmt(t){ t = Math.floor(t); return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0"); }

/* ---------- input ---------- */
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === " " || k.startsWith("arrow")) e.preventDefault();
  if (k === "enter" && (mode === "menu" || mode === "over")) start();
  if (mode === "levelup" && "123".includes(k) && k.length === 1) pick(+k - 1);
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; stick = null; });

cv.addEventListener("pointerdown", e => {
  stick = { id:e.pointerId, x:e.clientX, y:e.clientY, dx:0, dy:0 };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (!stick || e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.x, dy = e.clientY - stick.y;
  const m = Math.hypot(dx, dy), max = 60;
  if (m > max){ dx *= max/m; dy *= max/m; stick.x = e.clientX - dx; stick.y = e.clientY - dy; }
  stick.dx = dx/max; stick.dy = dy/max;
});
const endStick = e => { if (stick && e.pointerId === stick.id) stick = null; };
cv.addEventListener("pointerup", endStick);
cv.addEventListener("pointercancel", endStick);
$("startBtn").onclick = start;
$("againBtn").onclick = start;

/* ---------- level up ---------- */
let offer = [];
function openLevel(){
  mode = "levelup";
  offer = UPGRADES.slice().sort(() => Math.random() - .5).slice(0, 3);
  const box = $("cards"); box.innerHTML = "";
  offer.forEach((u, i) => {
    const b = document.createElement("button");
    b.className = "card";
    b.innerHTML = `<strong>${u.n}</strong><span>${u.d}</span>`;
    b.onclick = () => pick(i);
    box.appendChild(b);
  });
  show("lvl");
  box.firstChild.focus();
}
function pick(i){
  if (!offer[i]) return;
  offer[i].f(G.s, G.p);
  mode = "play"; show(null);
}

function gameOver(){
  mode = "over";
  const t = G.t;
  $("oT").textContent = fmt(t); $("oK").textContent = G.kills; $("oL").textContent = G.level;
  if (t > best){
    best = t;
    try { localStorage.setItem("lantern-best", String(t)); } catch(e){}
    $("oB").textContent = "A new longest night.";
  } else {
    $("oB").textContent = "Longest night so far: " + fmt(best);
  }
  $("hud").hidden = true;
  show("over");
  $("againBtn").focus();
}

/* ---------- simulation ---------- */
function spawnEnemy(){
  if (G.en.length > 350) return;
  const a = Math.random() * Math.PI * 2, d = Math.hypot(W, H) / 2 + 40, t = G.t, r = Math.random();
  let type = "moth";
  if (t > 75 && r < .12) type = "big"; else if (t > 25 && r < .3) type = "swift";
  const T = TYPES[type];
  G.en.push({ x:G.p.x + Math.cos(a)*d, y:G.p.y + Math.sin(a)*d, type,
    hp:T.hp * (1 + t/120), r:T.r, sp:T.sp * (.9 + Math.random()*.2),
    ph:Math.random()*6.28, wob:Math.random()*6.28 });
}
function burst(x, y, n, col){
  for (let i = 0; i < n; i++){
    const a = Math.random()*6.28, v = 40 + Math.random()*90;
    G.pt.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:.45, col });
  }
}
function hurt(e, d){
  if (e.dead) return;
  e.hp -= d;
  if (e.hp <= 0){
    e.dead = true; G.kills++;
    G.sd.push({ x:e.x, y:e.y, v:e.type === "big" ? 4 : 1 });
    burst(e.x, e.y, e.type === "big" ? 14 : 6, TYPES[e.type].col);
  }
}
const orbPos = i => {
  const a = G.orbAng + i * Math.PI * 2 / G.s.orbit;
  return { x:G.p.x + Math.cos(a)*62, y:G.p.y + Math.sin(a)*62 };
};

function update(dt){
  const g = G, p = g.p, s = g.s;
  g.t += dt; p.inv -= dt; g.shake = Math.max(0, g.shake - dt*30);
  p.hp = Math.min(p.max, p.hp + .5*dt);

  // movement
  let mx = (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0);
  let my = (keys.s||keys.arrowdown?1:0)  - (keys.w||keys.arrowup?1:0);
  if (stick){ mx += stick.dx; my += stick.dy; }
  const m = Math.hypot(mx, my); if (m > 1){ mx /= m; my /= m; }
  p.x += mx * p.speed * dt; p.y += my * p.speed * dt;

  // spawning ramps up over time
  g.spawn += (0.9 + g.t * 0.035) * dt;
  while (g.spawn >= 1){ g.spawn--; spawnEnemy(); }

  // auto-fire at nearest moth
  g.cd -= dt;
  if (g.cd <= 0){
    let best = null, bd = 440*440;
    for (const e of g.en){
      const d = (e.x-p.x)**2 + (e.y-p.y)**2;
      if (d < bd){ bd = d; best = e; }
    }
    if (best){
      g.cd = 1 / s.rate;
      const base = Math.atan2(best.y-p.y, best.x-p.x);
      for (let i = 0; i < s.multi; i++){
        const a = base + (i - (s.multi-1)/2) * .16;
        g.bl.push({ x:p.x, y:p.y, vx:Math.cos(a)*420, vy:Math.sin(a)*420, life:1.1, pi:s.pierce, hit:new Set() });
      }
    } else g.cd = .1;
  }

  // bullets
  for (const b of g.bl){
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    for (const e of g.en){
      if (e.dead || b.hit.has(e)) continue;
      if ((e.x-b.x)**2 + (e.y-b.y)**2 < (e.r+4)**2){
        b.hit.add(e); hurt(e, s.dmg);
        if (b.pi-- <= 0){ b.life = 0; break; }
      }
    }
  }
  g.bl = g.bl.filter(b => b.life > 0);

  // fireflies
  g.orbAng += dt * 2.6;
  for (let i = 0; i < s.orbit; i++){
    const o = orbPos(i);
    for (const e of g.en) if (!e.dead && (e.x-o.x)**2 + (e.y-o.y)**2 < (e.r+7)**2) hurt(e, 22*dt*s.dmg);
  }

  // enemies
  for (const e of g.en){
    if (e.dead) continue;
    const a = Math.atan2(p.y-e.y, p.x-e.x) + Math.sin(g.t*3 + e.wob) * .55;
    e.x += Math.cos(a)*e.sp*dt; e.y += Math.sin(a)*e.sp*dt;
    if (p.inv <= 0 && (e.x-p.x)**2 + (e.y-p.y)**2 < (e.r+p.r)**2){
      p.hp -= TYPES[e.type].dmg; p.inv = .6; g.shake = 8;
      burst(p.x, p.y, 8, "#ff6b8b");
    }
  }
  g.en = g.en.filter(e => !e.dead);
  if (p.hp <= 0) return gameOver();

  // seeds
  for (const sd of g.sd){
    const dx = p.x-sd.x, dy = p.y-sd.y, d = Math.hypot(dx, dy);
    if (d < s.magnet){ sd.x += dx/d*280*dt; sd.y += dy/d*280*dt; }
    if (d < 14){ sd.got = true; g.xp += sd.v; }
  }
  g.sd = g.sd.filter(sd => !sd.got);

  // particles
  for (const q of g.pt){ q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt; }
  g.pt = g.pt.filter(q => q.life > 0);

  if (g.xp >= g.need){
    g.xp -= g.need; g.level++; g.need = Math.round(4 + g.level*3.5);
    openLevel();
  }

  // HUD
  $("xp").firstElementChild.style.width = (g.xp / g.need * 100) + "%";
  $("lv").innerHTML = `Lv ${g.level}`;
  $("tm").textContent = fmt(g.t);
  $("kl").innerHTML = `${g.kills}<small>moths</small>`;
}

/* ---------- rendering ---------- */
function hash(x, y){
  let h = (x*374761393 + y*668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return (h ^ (h >>> 16)) >>> 0;
}

function drawMoth(e, sx, sy, t){
  const ang = Math.atan2(G.p.y-e.y, G.p.x-e.x);
  const f = .55 + .45 * Math.abs(Math.sin(t * (e.type === "swift" ? 26 : 16) + e.ph));
  const r = e.r;
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(ang);
  ctx.fillStyle = TYPES[e.type].col;
  ctx.beginPath(); ctx.ellipse(-r*.1, -r*.75*f, r*.9, r*.55, -.4, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-r*.1,  r*.75*f, r*.9, r*.55,  .4, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#5b4a8a"; ctx.fillRect(-r*.7, -r*.18, r*1.4, r*.36);
  ctx.restore();
}

function glow(x, y, r, rgb, a){
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x-r, y-r, r*2, r*2);
}

function draw(t){
  const p = G.p, s = G.s;
  const sh = REDUCED ? 0 : G.shake;
  const ox = W/2 - p.x + (Math.random()-.5)*sh, oy = H/2 - p.y + (Math.random()-.5)*sh;
  const px = ox + p.x, py = oy + p.y;

  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#1a1430"; ctx.fillRect(0, 0, W, H);

  // ground: hashed grass ticks and the odd flower
  const cell = 80, cx0 = Math.floor((p.x - W/2)/cell) - 1, cy0 = Math.floor((p.y - H/2)/cell) - 1;
  for (let cx = cx0; cx <= cx0 + W/cell + 2; cx++){
    for (let cy = cy0; cy <= cy0 + H/cell + 2; cy++){
      const h = hash(cx, cy), x = cx*cell + (h & 127)/127*cell, y = cy*cell + ((h>>7) & 127)/127*cell;
      if (h % 11 === 0){
        ctx.fillStyle = "rgba(255,107,139,.5)"; ctx.beginPath(); ctx.arc(x+ox, y+oy, 2.5, 0, 6.283); ctx.fill();
      } else if (h % 3 !== 0){
        ctx.strokeStyle = "rgba(95,227,192,.22)"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x+ox, y+oy); ctx.lineTo(x+ox+1.5, y+oy-7); ctx.stroke();
      }
    }
  }

  // moths
  for (const e of G.en){
    const sx = e.x + ox, sy = e.y + oy;
    if (sx < -30 || sx > W+30 || sy < -30 || sy > H+30) continue;
    drawMoth(e, sx, sy, t);
  }

  // darkness with a flickering pool of light
  const R = s.light * (1 + .03*Math.sin(t*9) + .02*Math.sin(t*23));
  const dk = ctx.createRadialGradient(px, py, R*.25, px, py, R*1.7);
  dk.addColorStop(0, "rgba(12,8,30,0)");
  dk.addColorStop(.55, "rgba(12,8,30,.38)");
  dk.addColorStop(1, "rgba(12,8,30,.8)");
  ctx.fillStyle = dk; ctx.fillRect(0, 0, W, H);

  // emissive things
  ctx.globalCompositeOperation = "lighter";
  glow(px, py, R*.9, "255,182,72", .28);
  for (const sd of G.sd) glow(sd.x+ox, sd.y+oy, 14, "95,227,192", .9);
  for (const b of G.bl)  glow(b.x+ox,  b.y+oy,  12, "255,182,72", .95);
  for (let i = 0; i < s.orbit; i++){ const o = orbPos(i); glow(o.x+ox, o.y+oy, 18, "255,240,160", 1); }
  for (const q of G.pt){
    ctx.globalAlpha = Math.max(0, q.life / .45); ctx.fillStyle = q.col;
    ctx.fillRect(q.x+ox-1.5, q.y+oy-1.5, 3, 3);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";

  // lantern + health pip
  ctx.fillStyle = (p.inv > 0 && Math.floor(t*20) % 2) ? "#fff" : "#ffb648";
  ctx.beginPath(); ctx.arc(px, py, p.r, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#fff4cf"; ctx.beginPath(); ctx.arc(px, py, p.r*.5, 0, 6.283); ctx.fill();
  const hw = 36;
  ctx.fillStyle = "rgba(255,255,255,.15)"; ctx.fillRect(px-hw/2, py+p.r+7, hw, 4);
  ctx.fillStyle = "#ff6b8b"; ctx.fillRect(px-hw/2, py+p.r+7, hw * Math.max(0, p.hp/p.max), 4);

  // touch stick
  if (stick){
    ctx.strokeStyle = "rgba(243,236,255,.3)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(stick.x, stick.y, 60, 0, 6.283); ctx.stroke();
    ctx.fillStyle = "rgba(243,236,255,.35)";
    ctx.beginPath(); ctx.arc(stick.x + stick.dx*60, stick.y + stick.dy*60, 20, 0, 6.283); ctx.fill();
  }
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (mode === "play") update(dt);
  draw(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
